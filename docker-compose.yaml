services:
  shoppingCartService:
    container_name: shoppingCartService
    image: shopping-cart-service
    ports:
      - 8080:8080
    environment:
      PRODUCT_SERVICE_URL: http://productService:8080
    networks:
      - app-network

  productService:
    container_name: productService
    image: product-service
    ports:
      - 8081:8080
    networks:
      - app-network

networks:
  app-network: